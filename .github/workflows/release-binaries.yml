name: release-binaries

# The conongnang line. One Windows build per push: clang-cl with ThinLTO and lichii-windows.profdata, the MSVC-ABI
# profile upstream trained on Ocarina of Time (zortos293/Lichii#526). Steps from that workflow.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binary as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - conongnang
    # A binary only changes when build inputs change; docs-only pushes skip the build.
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - "*.profdata"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

env:
  # The installer is pinned by checksum so a runner image update never changes the compiler.
  # clang-cl 22 reads the profile's indexed format; the profile was merged with this LLVM.
  WINDOWS_LLVM_VERSION: "22.1.8"
  WINDOWS_LLVM_SHA256: "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"
  PROFILE: lichii-windows.profdata

# A running build is never cancelled: it finishes and publishes. A push meanwhile queues one build;
# a later push replaces it, so the newest commit builds as soon as the running one is done.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: windows-x86_64-pgo binary
    needs: prepare-release
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check PGO profile
        shell: bash
        run: test -s "$PROFILE"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step put
      # on PATH; only the compiler, linker and archiver come from this LLVM.
      - name: Install LLVM
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
          Invoke-WebRequest -OutFile $installer "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:WINDOWS_LLVM_VERSION/LLVM-$env:WINDOWS_LLVM_VERSION-win64.exe"
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $env:WINDOWS_LLVM_SHA256) {
            throw 'LLVM installer checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'llvm'
          Start-Process -Wait -FilePath $installer -ArgumentList '/S', "/D=$root"
          $version = & "$root/bin/clang-cl.exe" --version
          $version
          if (-not ($version -match "clang version $([regex]::Escape($env:WINDOWS_LLVM_VERSION))")) {
            throw "Unexpected clang-cl: $version"
          }
          "LLVM_ROOT=$($root.Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          # Its own key: this line patches sirit (.patch/sirit), and main's downloads are unpatched.
          key: cpm-windows-clangcl-conongnang-v1-${{ hashFiles('cpmfile.json', '.patch/**', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-windows-clangcl-conongnang-v1-

      # The profile's hash is part of the key, so objects built against another profile are
      # never restored.
      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-windows-clangcl-${{ hashFiles('lichii-windows.profdata') }}-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-windows-clangcl-${{ hashFiles('lichii-windows.profdata') }}-v1-${{ github.sha }}-
            objects-windows-clangcl-${{ hashFiles('lichii-windows.profdata') }}-v1-

      # A profile older than the source only warns: functions changed since training lose their
      # profile data and are optimized as in a plain ThinLTO build. sirit is built from source:
      # the bundled one MSVC-style builds download by default lacks .patch/sirit (OpAtomicFAddEXT).
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          flags+=" -fprofile-use=$(cygpath -m "$PWD/$PROFILE")"
          flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
          flags+=" -Wno-error=backend-plugin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_SIRIT=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DLICHII_BUILD_TAG=build-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-pgo \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe

      # The artifact is the bin folder itself: GitHub zips artifacts on download. The release job
      # zips it once for the release.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-windows-x86_64-pgo-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

  # Publishes the binary as a GitHub pre-release: on pushes to main, and on manual runs unless
  # "Publish the binary as a GitHub release" is unticked.
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Downloaded by name, the artifact (the bin folder) is extracted straight into `path`.
      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: lichii-windows-x86_64-pgo-${{ github.sha }}
          path: bin

      - name: Package release file
        shell: bash
        run: |
          set -euo pipefail
          test -f bin/lichii.exe
          mkdir dist
          (cd bin && zip -qr "${GITHUB_WORKSPACE}/dist/lichii-windows-x86_64-pgo.zip" .)
          ls -la dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag $tag points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}: conongnang/Lichii oot-amd-perf-2 (568b103) plus the changes in this branch's history.

          Download [lichii-windows-x86_64-pgo.zip](${base}/lichii-windows-x86_64-pgo.zip), extract it to its own folder and run \`lichii.exe\`. Your existing settings, keys, saves, games and shader cache are used as they are. If Windows asks for the Visual C++ runtime, run \`vc_redist.x64.exe\` from the same folder.

          Built with clang-cl, ThinLTO and the Ocarina of Time trained profile (lichii-windows.profdata).
          EOF
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "Lichii ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md
